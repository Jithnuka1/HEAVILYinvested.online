<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omi | Heavily Invested</title>

    <link rel="stylesheet" href="/omi/style.css">
</head>

<body>

<div id="game">

    <!-- SCORE BAR -->
    <div id="topBar">

        <div class="score team-score-box" id="our-score-box">
            <span>YOUR TEAM</span>
            <strong id="team-score">0</strong>
        </div>

        <div id="game-info">
            <div id="round-status">Welcome to Omi</div>
            <div id="trump-display">Trump: —</div>
        </div>

        <div class="score opponent-score-box" id="opponent-score-box">
            <span>OPPONENTS</span>
            <strong id="opponent-score">0</strong>
        </div>

    </div>


    <!-- TABLE -->
    <div id="table">

        <!-- TEAMMATE -->
        <div class="player top-player">

            <div class="identity">
                <div id="partner-avatar" class="avatar"></div>

                <div class="identity-text">
                    <div class="player-name" id="partner-name">
                        Partner
                    </div>

                    <div class="team-label">
                        YOUR TEAM
                    </div>
                </div>
            </div>

            <div id="partner-hand" class="hidden-hand"></div>

        </div>


        <!-- LEFT OPPONENT -->
        <div class="player left-player">

            <div class="identity">
                <div id="left-avatar" class="avatar"></div>

                <div class="identity-text">
                    <div class="player-name" id="left-name">
                        Opponent
                    </div>

                    <div class="team-label">
                        OPPONENT
                    </div>
                </div>
            </div>

            <div id="left-hand" class="hidden-hand vertical"></div>

        </div>


        <!-- RIGHT OPPONENT -->
        <div class="player right-player">

            <div class="identity">
                <div id="right-avatar" class="avatar"></div>

                <div class="identity-text">
                    <div class="player-name" id="right-name">
                        Opponent
                    </div>

                    <div class="team-label">
                        OPPONENT
                    </div>
                </div>
            </div>

            <div id="right-hand" class="hidden-hand vertical"></div>

        </div>


        <!-- CENTER -->
        <div id="center-area">

            <div id="trick-counter">
                Your Team:
                <span id="our-tricks">0</span>

                &nbsp; • &nbsp;

                Opponents:
                <span id="their-tricks">0</span>
            </div>


            <div id="played-cards">

                <div id="played-2"
                     class="played-position played-top"></div>

                <div id="played-1"
                     class="played-position played-left"></div>

                <div id="played-3"
                     class="played-position played-right"></div>

                <div id="played-0"
                     class="played-position played-bottom"></div>

            </div>

        </div>


        <!-- YOU -->
        <div class="player bottom-player">

            <div class="identity human-identity">

                <div class="avatar human-avatar">
                    <div class="avatar-face default-human">
                        <div class="hair short black"></div>
                        <div class="eye eye-left"></div>
                        <div class="eye eye-right"></div>
                        <div class="mouth"></div>
                    </div>
                </div>

                <div class="identity-text">
                    <div class="player-name" id="human-name">
                        You
                    </div>

                    <div class="team-label">
                        YOU
                    </div>
                </div>

            </div>

            <div id="human-hand"></div>

        </div>

    </div>


    <!-- NAME SCREEN -->
    <div id="name-modal" class="modal">

        <div class="modal-box welcome-box">

            <div class="omi-small">
                HEAVILY INVESTED
            </div>

            <h1>OMI</h1>

            <p>
                Enter your name to take a seat.
            </p>

            <input
                id="name-input"
                type="text"
                maxlength="18"
                placeholder="Your name"
                autocomplete="off"
            >

            <button id="start-game">
                Take Your Seat
            </button>

        </div>

    </div>


    <!-- TRUMP -->
    <div id="trump-modal" class="modal hidden">

        <div class="modal-box">

            <h2>Choose Trump</h2>

            <p>
                Choose the trump suit using your first four cards.
            </p>

            <div class="suit-buttons">

                <button data-suit="♠">♠</button>

                <button class="red"
                        data-suit="♥">♥</button>

                <button class="red"
                        data-suit="♦">♦</button>

                <button data-suit="♣">♣</button>

            </div>

        </div>

    </div>


    <!-- ROUND RESULT -->
    <div id="result-modal" class="modal hidden">

        <div class="modal-box">

            <h2 id="result-title">
                Round Complete
            </h2>

            <p id="result-text"></p>

            <button id="next-round">
                Next Round
            </button>

        </div>

    </div>


    <!-- GAME OVER -->
    <div id="game-over-modal" class="modal hidden">

        <div class="modal-box">

            <h2 id="game-over-title">
                Game Over
            </h2>

            <p id="game-over-text"></p>

            <button id="restart-game">
                Play Again
            </button>

        </div>

    </div>


    <!-- USED FOR FLYING CARD ANIMATION -->
    <div id="animation-layer"></div>

</div>


<script src="/omi/game.js"></script>

</body>
</html>
